# nginx server block for CigaretteBuddy behind host nginx.
# Pair with docker-compose.nginx.yml, which publishes the containers on
# 127.0.0.1:3000 (api) and 127.0.0.1:8080 (web).
#
# Install:
#   sudo cp deploy/nginx/cigbuddy.conf /etc/nginx/sites-available/cigbuddy
#   sudo sed -i 's/YOUR_DOMAIN/your.domain.com/g' /etc/nginx/sites-available/cigbuddy
#   sudo ln -s /etc/nginx/sites-available/cigbuddy /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your.domain.com      # adds the TLS listener
#
# certbot rewrites this file to add the 443 server and an 80 -> 443 redirect.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 1m;

    # Room signaling WebSocket plus the health/ICE endpoints.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Idle sockets are kept alive by the API's 15 s ping; this only has to
        # outlast a stalled one.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The SvelteKit server renders everything else.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
