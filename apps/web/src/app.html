<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Google Search wants a favicon that is a multiple of 48px and also
         tries /favicon.ico at the site root; an SVG on its own was showing up
         as the generic globe. The PNG/ICO copies are rendered from
         favicon.svg (see the sizes in static/). -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Runs before anything paints, so a visitor who has already answered the
      18+ gate never sees it flash. The gate itself is always server-rendered;
      `.ag-gate` is display:none under this attribute (see app.css).

      Deliberately inline and render-blocking -- deferring it defeats the whole
      point. Setting an attribute on <html> is hydration-safe: Svelte does not
      hydrate the root element, and attribute diffs never trigger the mismatch
      warning, only structural ones do.
    -->
    <script>
      try {
        if (localStorage.getItem('cb:age-ok') === 'yes') {
          document.documentElement.setAttribute('data-age', 'ok');
        }
      } catch (e) {
        // Private mode can throw on access. Leave the attribute off and let the
        // gate ask again: failing closed is correct here.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
