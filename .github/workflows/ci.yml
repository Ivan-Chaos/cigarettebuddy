# Push to main → verify, build both images, deploy them to the VPS.
#
# Pull requests stop after `verify`; only a push to main builds images and
# touches the server. Required repository secrets are listed in the README
# under "Continuous deployment".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One pipeline per branch. PR runs are cancelled when a new commit lands; a
# main run is never cancelled mid-deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs that need more (pushing images, reading them from the server) raise it
# themselves.
permissions:
  contents: read

env:
  # The images are named after the repository, lowercased by the registry step.
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # apps/api/src/env.ts validates at import time, so the tests need a
      # connection string. Nothing here connects — postgres.js dials lazily.
      DATABASE_URL: postgres://cigbuddy:cigbuddy@127.0.0.1:5432/cigbuddy
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm check

      - run: pnpm test

      # Catches build-only breakage (SvelteKit route errors, tsup entry points)
      # before the much slower image builds start.
      - run: pnpm build

  images:
    name: Build ${{ matrix.app }} image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}
          # The commit SHA is what the deploy pins to; `latest` is for humans.
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      # Both Dockerfiles take the repo root as their context.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to VPS
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH || '~/cigarettebuddy' }}
    steps:
      - name: Load the SSH key and the server's host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

      # The job's own token is enough to pull and it expires with the run, so
      # no long-lived registry credential has to live on the server.
      - name: Log the server into GHCR
        run: |
          printf '%s\n' "$GH_TOKEN" | ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The checkout on the server is updated first: compose files, the
      # Caddyfile and deploy.sh itself ship from git, and only the application
      # code comes from the images.
      - name: Update the checkout and start the new images
        run: |
          # Registry names are lowercase; the owner in GITHUB_REPOSITORY is not.
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s <<EOF
          set -euo pipefail
          cd "$VPS_PATH"
          git fetch --prune origin main
          git reset --hard "$GITHUB_SHA"
          IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$GITHUB_SHA" bash scripts/deploy.sh
          EOF

      - name: Drop the server's registry credentials
        if: always()
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "docker logout ghcr.io" || true
